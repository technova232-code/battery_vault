name: battery_vault
description: Battery optimizer with secret vault - محسّن البطارية مع خزنة سرية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Battery
  battery_plus: ^6.0.1

  # Storage & Security
  flutter_secure_storage: ^9.2.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0

  # Media / Vault
  photo_manager: ^3.3.0
  video_player: ^2.9.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # UI & Animations
  lottie: ^3.1.2
  percent_indicator: ^4.2.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

  # Ads - Unity Ads
  unity_ads_plugin: ^0.3.30

  # Utils
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  encrypt: ^5.0.3
  crypto: ^3.0.5
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
