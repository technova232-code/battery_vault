workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    environment:
      flutter: 3.22.0
      java: 17
      android_signing:
        - battery_vault_keystore
      vars:
        PACKAGE_NAME: "com.technova.battery_vault"
        UNITY_GAME_ID: "800001883"

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
        - ~/.pub-cache

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Set up local.properties
        script: |
          mkdir -p "$CM_BUILD_DIR/battery_vault/android"
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/battery_vault/android/local.properties"
          echo "flutter.versionName=1.0.0" >> "$CM_BUILD_DIR/battery_vault/android/local.properties"
          echo "flutter.versionCode=1" >> "$CM_BUILD_DIR/battery_vault/android/local.properties"

      - name: Set up key.properties
        script: |
          cat > "$CM_BUILD_DIR/battery_vault/android/key.properties" <<KEYEOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          KEYEOF

      - name: Set up Gradle
        script: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << GRADLEEOF
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g
          android.useAndroidX=true
          android.enableJetifier=true
          GRADLEEOF

      - name: Get Flutter packages
        script: cd battery_vault && flutter pub get

      - name: Generate localizations
        script: cd battery_vault && flutter gen-l10n

      - name: Fix compileSdkVersion
        script: |
          sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' battery_vault/android/app/build.gradle
          sed -i 's/targetSdkVersion 34/targetSdkVersion 36/g' battery_vault/android/app/build.gradle

      - name: Build APK Release
        script: |
          cd battery_vault && flutter build apk --release --split-per-abi --no-tree-shake-icons

    artifacts:
      - battery_vault/build/app/outputs/flutter-apk/*.apk
