workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    environment:
      flutter: 3.22.0
      java: 17
      android_signing:
        - battery_vault_keystore
      vars:
        PACKAGE_NAME: "com.technova.battery_vault"
        UNITY_GAME_ID: "YOUR_UNITY_GAME_ID"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Set up local.properties
        script: |
          mkdir -p "$CM_BUILD_DIR/battery_vault/android"
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/battery_vault/android/local.properties"
          echo "flutter.versionName=1.0.0" >> "$CM_BUILD_DIR/battery_vault/android/local.properties"
          echo "flutter.versionCode=1" >> "$CM_BUILD_DIR/battery_vault/android/local.properties"

      - name: Set up key.properties
        script: |
          cat >> "$CM_BUILD_DIR/battery_vault/android/key.properties" <<KEYEOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          KEYEOF

      - name: Get Flutter packages
        script: |
          cd battery_vault && flutter pub get

      - name: Generate localizations
        script: |
          cd battery_vault && flutter gen-l10n

      - name: Build APK Release
        script: |
          cd battery_vault && flutter build apk --release --split-per-abi

    artifacts:
      - battery_vault/build/app/outputs/flutter-apk/*.apk
