workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 60
    environment:
      flutter: 3.22.0
      java: 17
      android_signing:
        - battery_vault_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.technova.battery_vault"
        GOOGLE_PLAY_TRACK: "internal"
        UNITY_GAME_ID: $UNITY_GAME_ID

    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.versionName=$(grep 'version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d ' ')" >> "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.versionCode=$(grep 'version:' pubspec.yaml | sed 's/.*+//')" >> "$CM_BUILD_DIR/android/local.properties"

      - name: Set up key.properties
        script: |
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate localizations
        script: |
          flutter gen-l10n

      - name: Build AAB (Release)
        script: |
          flutter build appbundle --release \
            --dart-define=UNITY_GAME_ID=$UNITY_GAME_ID

      - name: Build APK (Release)
        script: |
          flutter build apk --release --split-per-abi \
            --dart-define=UNITY_GAME_ID=$UNITY_GAME_ID

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/flutter-apk/*.apk
      - flutter_drive.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: $GOOGLE_PLAY_TRACK
        submit_as_draft: true

  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    environment:
      flutter: 3.22.0
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: develop
          include: true
          source: true
        - pattern: feature/*
          include: true
          source: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.versionName=1.0.0" >> "$CM_BUILD_DIR/android/local.properties"
          echo "flutter.versionCode=1" >> "$CM_BUILD_DIR/android/local.properties"

      - name: Get Flutter packages
        script: flutter pub get

      - name: Generate localizations
        script: flutter gen-l10n

      - name: Build Debug APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
